[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-service"
version = "1.0.0"
description = "Production REST API for student grade management and analytics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Denys Zastavnyi"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fastapi", "grades", "students", "production", "docker"]
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "numpy>=2,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
grade-service = "grade_service.main:main"
grade-service-benchmark = "grade_service.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=grade_service --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["grade_service"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B023"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations", "tools"]
