name: Production CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: Lab_10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Lab_10/pyproject.toml
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest with coverage threshold
        run: pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify package artifacts
        run: test -n "$(find dist -name '*.whl' -print -quit)" && test -n "$(find dist -name '*.tar.gz' -print -quit)"
      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: grade-service-distributions
          path: Lab_10/dist/*

  docker:
    name: Docker production image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab_10
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --tag grade-service:ci .
      - name: Start container
        run: docker run --detach --name grade-service-ci --publish 8000:8000 --env APP_ENV=test grade-service:ci
      - name: Verify health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health | grep '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs grade-service-ci
          exit 1
